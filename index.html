<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>명함첩</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="명함첩">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f8fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161d" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180-v1.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v1.png">
<link rel="manifest" href="manifest.webmanifest?v=1">
<style>
/* ═══ app-kit.css — 모바일 웹앱 공통 (화면 채우기 · 로딩 · 스와이프 · 시트) ═══
   색은 :root 의 토큰만 바꿔서 앱마다 맞춘다. --solid 는 탭바/하단 띠 색이며 html 배경과 같아야 한다. */
:root{
  --bg:#f3f5f8; --solid:#ffffff; --ink:#12151c; --muted:#6b7280; --line:rgba(18,21,28,.10);
  --accent:#3b6cf6; --danger:#e5484d;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#10141b; --solid:#171c25; --ink:#f2f4f8; --muted:#9aa3b2; --line:rgba(255,255,255,.12); color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ── 1. 화면 채우기 (위아래 공백 제거) ──
   · html 배경 = 하단 띠 색(--solid): 아이폰이 그리지 않는 맨 아래 칸이 탭바와 이어져 보인다.
   · 문서는 스크롤하지 않고(#sc 만 스크롤) 탭바는 fixed 가 아닌 flex 맨 아래 칸에 둔다.
   · --app-h 는 app-kit.js 의 fixViewport() 가 실제 화면 높이로 넣어 준다. */
html{height:100%;background:var(--solid);overflow:hidden}
body{margin:0;height:var(--app-h,100%);overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);overscroll-behavior:none;-webkit-text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.ak-top{flex:none;display:flex;align-items:center;gap:8px;background:var(--bg);
  padding:calc(8px + var(--sat)) max(16px,var(--sar)) 8px max(16px,var(--sal))}
.ak-top h1{flex:1;margin:0;font-size:20px;font-weight:800}
#sc{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding:4px max(16px,var(--sar)) 20px max(16px,var(--sal))}
.ak-tabs{flex:none;display:flex;background:var(--solid);border-top:1px solid var(--line);
  padding:6px max(8px,var(--sar)) max(6px,calc(var(--sab) - 14px)) max(8px,var(--sal))}
.ak-tabs button{flex:1;border:0;background:none;font:inherit;font-size:11px;font-weight:600;color:var(--muted);
  padding:6px 0;display:grid;gap:2px;justify-items:center;cursor:pointer}
.ak-tabs button .i{font-size:20px;line-height:1}
.ak-tabs button.on{color:var(--accent)}
/* 아이폰은 16px 보다 작은 입력칸을 누르면 화면을 확대한다 */
input,select,textarea{font-size:16px}
/* 키보드가 올라와 있는 동안 아래 여백 (AppKit.keyboardSafe) */
body.kb #sc{padding-bottom:50vh}
button{touch-action:manipulation}

/* ── 2. 로딩 ── */
/* 2-1 첫 화면: JS 가 뜨기 전부터 보이는 아이콘 + 문구 */
.ak-boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);text-align:center;transition:opacity .25s}
.ak-boot.out{opacity:0;pointer-events:none}
.ak-boot img{width:84px;height:84px;border-radius:20px;animation:ak-breathe 1.6s ease-in-out infinite}
.ak-boot p{margin:14px 0 0;color:var(--muted);font-size:14px}
@keyframes ak-breathe{50%{transform:scale(.94);opacity:.75}}
/* 2-2 누른 동작 처리 중: 위쪽 진행 막대 + 알약 + 누른 버튼 스피너 */
.ak-bar{position:fixed;left:0;right:0;top:0;height:3px;z-index:60;pointer-events:none;opacity:0;transition:opacity .2s;overflow:hidden;
  background:color-mix(in srgb,var(--accent) 18%,transparent)}
.ak-bar.on{opacity:1}
.ak-bar::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;border-radius:3px;background:var(--accent);animation:ak-bar 1.1s ease-in-out infinite}
@keyframes ak-bar{to{left:100%}}
.ak-pill,.ak-toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));z-index:61;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;
  padding:9px 16px;border-radius:999px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 6px 24px rgba(0,0,0,.22)}
.ak-pill{display:flex;align-items:center;gap:8px}
.ak-pill.on,.ak-toast.on{opacity:1;transform:translate(-50%,0)}
.ak-pill.top{top:calc(14px + var(--sat));bottom:auto}
.ak-pill .e{display:inline-block;animation:ak-hop .5s ease-in-out infinite alternate}
@keyframes ak-hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-4px) rotate(6deg)}}
.ak-pill .d i{display:inline-block;width:4px;height:4px;margin-left:3px;border-radius:50%;background:currentColor;animation:ak-dot 1.2s infinite}
.ak-pill .d i:nth-child(2){animation-delay:.2s}.ak-pill .d i:nth-child(3){animation-delay:.4s}
@keyframes ak-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.is-busy{position:relative;pointer-events:none;opacity:.6}
.is-busy::after{content:"";position:absolute;right:12px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;
  border:2px solid currentColor;border-right-color:transparent;animation:ak-spin .7s linear infinite}
/* 2-3 배경 새로고침: 새로고침 아이콘만 돈다 */
.ak-icon-btn{border:0;background:none;color:inherit;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;padding:0}
/* 아이콘만 정확히 가운데 축으로 돈다 (버튼째 돌리면 꿀렁거림) */
.ak-icon-btn svg{display:block;transform-origin:50% 50%;will-change:transform}
.ak-spin{animation:ak-spin .8s linear infinite}
@keyframes ak-spin{to{transform:rotate(360deg)}}

/* ── 3. 스와이프 ── */
.ak-in-l{animation:ak-in-l .22s ease-out}.ak-in-r{animation:ak-in-r .22s ease-out}
@keyframes ak-in-l{from{transform:translateX(28px);opacity:0}}
@keyframes ak-in-r{from{transform:translateX(-28px);opacity:0}}
.ak-hscroll{overflow-x:auto;scrollbar-width:none;touch-action:pan-x;overscroll-behavior:contain}
.ak-hscroll::-webkit-scrollbar{display:none}

/* ── 4. 바텀시트 (끌어서 열고 닫기) ── */
.ak-scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.ak-scrim.on{opacity:1;pointer-events:auto}
.ak-sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  background:var(--solid);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding:0 max(18px,var(--sar)) calc(18px + var(--sab)) max(18px,var(--sal))}
.ak-sheet.on{transform:translateY(0)}
.ak-sheet.dragging{transition:none}
/* 시트 아래로 같은 색을 이어 붙여 아이폰 하단 틈을 가린다 */
.ak-sheet::after{content:"";position:absolute;left:0;right:0;top:calc(100% - 1px);height:200px;background:var(--solid)}
.ak-grab{flex:none;padding:8px 0 12px;touch-action:none;cursor:grab}
.ak-grab::before{content:"";display:block;width:40px;height:5px;border-radius:9px;margin:0 auto;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.ak-sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

@media (prefers-reduced-motion:reduce){
  .ak-bar::before,.ak-pill .e,.ak-pill .d i,.is-busy::after,.ak-spin,.ak-boot img{animation-duration:2.5s}
  .ak-in-l,.ak-in-r{animation:none}.ak-sheet,.ak-scrim{transition:none}
}

/* ── 5. 상태·오류·예시 표시 ── */
/* 숫자는 자릿수가 흔들리지 않게 */
.num{font-variant-numeric:tabular-nums}
/* 갱신 상태: <span class="ak-status"><i class="ak-dot live"></i>14:32 갱신</span> */
.ak-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ak-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.ak-dot.live{background:#22c55e;animation:ak-pulse 1.8s infinite}
.ak-dot.off{background:var(--danger)}
@keyframes ak-pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
/* 예시 데이터로 보는 중 */
.ak-demo{flex:none;background:var(--ink);color:var(--bg);text-align:center;font-size:12.5px;padding:calc(6px + var(--sat)) 6px 6px}
.ak-demo:not([hidden]) + .ak-top{padding-top:8px}
/* 앱 오류 */
.ak-err{flex:none;background:var(--danger);color:#fff;font-size:12.5px;line-height:1.4;padding:calc(6px + var(--sat)) 12px 6px;overflow-wrap:anywhere}
/* 빈 화면·불러오기 실패 */
.ak-empty{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;padding:36px 16px}
/* 설명 글은 가운데 정렬 + 낱말 중간에서 끊지 않기(한글 기본값은 글자 단위로 끊긴다) + 줄 길이 고르게.
   칸보다 긴 낱말(주소·코드)만 그 안에서 끊는다. 손으로 <br>을 넣어 맞추지 않는다 */
.ak-center,.note,.ak-empty,.ak-demo{word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
.ak-center,.note{text-align:center}
.ak-empty button{margin-top:12px;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:inherit;font-weight:600;border-radius:10px;padding:8px 16px}
/* 선 아이콘: <svg class="ak-ic" viewBox="0 0 24 24"><path …/></svg> — 글자색을 따라간다 */
.ak-ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.ak-dot.live{animation:none}}
/* ── 이 앱의 색 (파스텔 '하늘') ──
   어두운 화면에서 강조색이 밝은 파스텔이므로 그 위 글자는 흰색 대신 짙은 남색(--on-acc) */
:root{ --accent:#4f93c9; --bg:#f3f8fc; --chip:#e9f2fa; --top-ink:#1f4d70; --on-acc:#fff; --soft:#f4f7fa;
  --p-blue:#e3effa; --p-blue-ink:#245b86; --star:#e3a21a; --new:#fff6dc; --new-ink:#8a6212; }
@media (prefers-color-scheme:dark){ :root{ --bg:#10161d; --solid:#18202a; --accent:#8fc0e6; --chip:#1f2b38; --top-ink:#cfe5f6; --on-acc:#0d2436; --soft:#1d2631;
  --p-blue:#1e3346; --p-blue-ink:#a9d0ee; --new:#2e2a1c; --new-ink:#e9cf8a; } }

/* ── 이 앱의 화면 ── */
.ak-top h1{color:var(--top-ink);font-size:24px}
.ak-top .ak-icon-btn{color:var(--top-ink)}
#sc{padding-left:0;padding-right:0;padding-top:0}
.diag{color:var(--muted);font-size:11px;line-height:1.5;margin-top:16px;text-align:center;word-break:keep-all}
.pad{padding:0 max(16px,var(--sar)) 0 max(16px,var(--sal))}

/* 위 도구 줄: 전체(N) ▾ · 정렬 */
.bar{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:4px;padding:2px max(10px,var(--sar)) 6px max(16px,var(--sal));border-bottom:1px solid var(--line)}
.bar .sel{border:0;background:none;color:var(--ink);font:inherit;font-size:17px;font-weight:800;padding:8px 4px;display:flex;align-items:center;gap:4px}
.bar .sel .ak-ic{width:18px;height:18px}
.bar .sp{flex:1}
.bar .tool{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:8px;display:flex;align-items:center;gap:4px;min-height:40px}
.bar .tool .ak-ic{width:17px;height:17px}
.sbox{display:flex;align-items:center;gap:8px;background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:0 10px;height:44px;margin:10px max(16px,var(--sar)) 4px max(16px,var(--sal))}
.sbox .ak-ic{width:18px;height:18px;color:var(--muted);flex:none}
.sbox input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;outline:none}
.sbox button{border:0;background:none;color:var(--muted);width:32px;height:32px;padding:0;display:grid;place-items:center}
.orgf{display:inline-flex;align-items:center;gap:6px;margin:10px 16px 0;border:0;border-radius:999px;background:var(--accent);color:var(--on-acc);font:inherit;font-size:13.5px;font-weight:700;padding:7px 12px}

/* 목록: 날짜(또는 초성·기관) 묶음 → 줄마다 글자 왼쪽, 명함 사진 오른쪽 */
.gh{padding:18px max(16px,var(--sar)) 6px max(16px,var(--sal));font-size:14px;font-weight:700;color:var(--muted)}
.gh span{font-weight:600;margin-left:6px;opacity:.8}
.row{display:flex;align-items:center;gap:14px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;
  padding:14px max(16px,var(--sar)) 14px max(16px,var(--sal));cursor:pointer}
.row .tx{flex:1;min-width:0}
.row .nm{font-size:18.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.row .l2{font-size:14px;color:var(--p-blue-ink);margin-top:4px;line-height:1.4;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .l3{font-size:14px;color:var(--ink);opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.new{background:var(--new)}
.tag{flex:none;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--new-ink);color:var(--new)}
.tag.cat{background:var(--chip);color:var(--muted);font-weight:700}
.star{color:var(--star);font-size:15px}
#st:empty{display:none}
/* 명함 사진 자리: 사진이 없으면 작은 명함 모양을 그린다 */
.th{flex:none;width:108px;height:64px;border-radius:5px;overflow:hidden;background:#fff;border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.08);position:relative}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.mini{padding:7px 8px;color:#1b2430;display:flex;flex-direction:column;justify-content:space-between}
.th.mini::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar,#4f93c9)}
.th.mini b{font-size:9px;color:#5b6573;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.mini i{font-style:normal;font-size:13px;font-weight:800}
.th.mini small{font-size:7.5px;color:#6b7280;white-space:nowrap;overflow:hidden}
@media (prefers-color-scheme:dark){.th{border-color:rgba(255,255,255,.18)}}
/* 읽는 중 */
.row.busy{cursor:default}.row.busy .nm{color:var(--muted);font-size:16px}
.row.busy .l2{color:var(--muted)}
.dots i{display:inline-block;width:5px;height:5px;margin-left:3px;border-radius:50%;background:currentColor;animation:ak-dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.row.fail .l2{color:var(--danger)}
.th .scan{position:absolute;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:scan 1.4s ease-in-out infinite alternate}
@keyframes scan{from{top:6%}to{top:92%}}

/* 사진 찍기 버튼 (탭바 바로 위, 오른쪽) */
.fab{position:fixed;right:max(18px,var(--sar));bottom:calc(var(--tabh,64px) + 16px);z-index:20;width:60px;height:60px;border-radius:50%;border:0;
  background:var(--accent);color:var(--on-acc);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(30,80,130,.6)}
.fab .ak-ic{width:28px;height:28px;stroke-width:2.2}
.fab[hidden]{display:none}
.ak-pill,.ak-toast{bottom:calc(var(--tabh,64px) + 92px)}

/* 기관 탭 */
.org{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;padding:12px max(16px,var(--sar)) 12px max(16px,var(--sal))}
.org .ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.org .tx{flex:1;min-width:0}.org .nm{font-weight:800;font-size:16px;word-break:keep-all}
.org .sub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org .n{flex:none;font-weight:800;color:var(--p-blue-ink);background:var(--p-blue);border-radius:999px;padding:3px 10px;font-size:13px}
.c0{background:#dceaf7;color:#245b86}.c1{background:#dff1e6;color:#21734a}.c2{background:#f6e7d6;color:#8a5317}
.c3{background:#ece4f7;color:#5d3f91}.c4{background:#f7e0e3;color:#93303f}.c5{background:#dff0f1;color:#1d6a70}
@media (prefers-color-scheme:dark){.c0{background:#1e3346;color:#a9d0ee}.c1{background:#1d3428;color:#9fd8b6}.c2{background:#3a2c1c;color:#e8c08f}
  .c3{background:#2e2540;color:#c9b4ee}.c4{background:#3d2328;color:#f0aab4}.c5{background:#1b3335;color:#9ad6da}}

/* 설정 */
.card{background:var(--solid);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px max(16px,var(--sar)) 0 max(16px,var(--sal))}
.card h2{margin:0 0 6px;font-size:16px}
.card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55;word-break:keep-all}
.card .ok{color:#21734a;font-weight:700}
@media (prefers-color-scheme:dark){.card .ok{color:#9fd8b6}}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--on-acc);font:inherit;font-weight:700;padding:13px;margin-top:12px;cursor:pointer;min-height:46px}
.btn.sub{background:var(--chip);color:var(--ink)}
.btn.del{background:none;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 35%,transparent)}
.btn .ak-ic{width:18px;height:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row2 .btn{margin-top:8px}

/* 시트 공통 */
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.sheet-h h2{margin:0;font-size:19px}
.pick{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:16px;padding:14px 4px;text-align:left}
.pick b{color:var(--muted);font-weight:600;font-size:14px}.pick.on{color:var(--p-blue-ink);font-weight:800}

/* 상세 시트 */
.big{border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;background:#fff}.big img{display:block;width:100%}
.dh .nm{font-size:23px;font-weight:800}.dh .nm small{font-size:14px;color:var(--muted);font-weight:600;margin-left:6px}
.dh .og{font-size:14.5px;color:var(--p-blue-ink);margin-top:4px;line-height:1.45;word-break:keep-all}
.chk{display:flex;align-items:center;gap:10px;background:var(--new);color:var(--new-ink);border-radius:12px;padding:10px 12px;margin:12px 0 0;font-size:13.5px;line-height:1.45;word-break:keep-all}
.chk span{flex:1}.chk button{flex:none;border:0;border-radius:9px;background:var(--new-ink);color:var(--new);font:inherit;font-weight:800;font-size:13px;padding:8px 12px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
.acts a,.acts button{display:grid;justify-items:center;gap:5px;padding:10px 0;border-radius:14px;background:var(--p-blue);color:var(--p-blue-ink);text-decoration:none;font:inherit;font-size:12px;font-weight:700;border:0}
.acts .off{opacity:.35;pointer-events:none}
.facts{margin-top:10px;border-top:2px solid var(--accent)}
.facts div{display:grid;grid-template-columns:5.2em 1fr;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
.facts span:first-child{color:var(--muted);font-size:13px;padding-top:1px}
.facts a{color:var(--p-blue-ink);text-decoration:none;word-break:break-all}
.memo{white-space:pre-wrap;word-break:keep-all}

/* 입력 시트 */
.form{display:grid;gap:10px}
.form label{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:11px;padding:11px 12px;font:inherit;font-size:16px;font-weight:400}
.form textarea{min-height:76px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shot{display:flex;align-items:center;gap:12px;border:1.5px dashed color-mix(in srgb,var(--accent) 55%,transparent);border-radius:14px;padding:12px;background:var(--p-blue);color:var(--p-blue-ink);font-weight:700;font-size:14px;cursor:pointer}
.shot img{width:96px;height:57px;object-fit:cover;border-radius:5px}
</style>

<body>
<div class="ak-boot"><div><img src="icon-180-v1.png" alt=""><p>불러오는 중…</p></div></div>

<header class="ak-top">
  <h1>명함첩</h1>
  <span class="ak-status"><span id="st" class="tag" style="background:var(--new);color:var(--new-ink)"></span></span>
  <button class="ak-icon-btn" id="find" type="button" aria-label="검색"><svg class="ak-ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <button class="ak-icon-btn" id="reload" type="button" aria-label="새로고침" onclick="refresh()"><svg class="ak-ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
</header>
<main id="sc"></main>
<button class="fab" type="button" data-shoot aria-label="명함 찍기"><svg class="ak-ic" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
<nav class="ak-tabs" aria-label="메뉴">
  <button type="button" data-tab="list"><span class="i">📇</span>명함</button>
  <button type="button" data-tab="org"><span class="i">🏛️</span>기관</button>
  <button type="button" data-tab="set"><span class="i">⚙️</span>설정</button>
</nav>

<div class="ak-sheet" id="sheet">
  <div class="ak-grab"></div>
  <div class="body"></div>
</div>

<script>
/* ═══ app-kit.js — 모바일 웹앱 공통 동작 ═══
   AppKit.fixViewport({gap})       화면 높이 보정 (아이폰 홈 화면 앱 위아래 공백 제거). 탭바가 화면 아래로 잘리면 {gap:false}
   AppKit.bootDone()               첫 로딩 화면 걷기
   AppKit.track(promise, opts)     진행 막대 + 알약 + 누른 버튼 스피너
   AppKit.wrap(fn, skip)           API 함수를 감싸 "방금 누른 동작"만 자동으로 진행 표시
   AppKit.spin(el, promise)        새로고침 아이콘 돌리기 (아이콘만 가운데 축으로, 멈출 땐 한 바퀴 마저 돌고 0도에서)
   AppKit.keyboardSafe()           입력칸을 누르면 키보드에 가리지 않게 여백 + 가운데로
   AppKit.toast(msg)               짧은 알림
   AppKit.swipe(el, {onNext,onPrev})  좌우 스와이프 (탭·날짜 넘기기)
   AppKit.tabs({...})              탭바 + 스와이프 + 넘김 애니메이션
   AppKit.sheet(el)                바텀시트 열기/닫기 + 끌어내려 닫기
   AppKit.autoUpdate(build)        version.txt 가 바뀌면 새 버전으로 다시 열기
   AppKit.env()                    진단 문구 (버전·홈 화면 앱 여부·화면 크기)
   AppKit.store('앱접두어')         localStorage 를 안전하게 (get/set/del)
   AppKit.esc / num / krw / signed / kstDate / addDays / hhmm   글자·숫자·날짜
   AppKit.poll(fn, ms, busy)       화면이 보일 때만 자동 새로고침 + 돌아오면 즉시
   AppKit.editing(view)            입력 중인지 (배경 새로고침이 입력값을 지우지 않게)
   AppKit.sequence()               늦게 온 예전 응답 버리기
   AppKit.showErrors(build)        앱 오류를 화면에 표시
   AppKit.sure(btn)                두 번 눌러야 지워지는 버튼
   AppKit.copy(text) / buzz()      복사 · 진동
   AppKit.toJpeg(file, maxSide)    사진 줄여서 올리기
   AppKit.device()                 접속 기록용 기기·방식 */
const AppKit = (() => {
  const $ = s => typeof s === 'string' ? document.querySelector(s) : s;
  const root = document.documentElement;
  const standalone = () => !!navigator.standalone || matchMedia('(display-mode: standalone)').matches;

  /* ── 1. 화면 높이 ──
     아이폰 홈 화면 앱은 웹 화면(innerHeight)을 실제 화면보다 짧게 잡을 때가 있다.
     그 차이(gap)만큼 문서 높이를 늘려 맨 아래 빈 띠를 없앤다. 가로 모드·브라우저에서는 보정하지 않는다. */
  let gap = 0;
  /* 주의(개찰알림 2026-11, iOS 홈 화면 앱·상태바 default): raw 가 상태바 높이만큼 잡혀 문서가 화면보다 길어지고
     탭바가 화면 아래로 잘렸다. 그런 기기에서는 fixViewport({ gap:false }) 로 보정을 끈다(남는 띠는 html 배경=탭바 색이라 이어져 보인다). */
  function fixViewport({ gap: useGap = true } = {}) {
    const set = () => {
      const portraitH = Math.max(screen.height, screen.width);
      const raw = innerHeight < innerWidth ? 0 : portraitH - innerHeight;
      gap = useGap && standalone() && raw > 0 && raw < 160 ? raw : 0;
      root.style.setProperty('--app-h', (innerHeight + gap) + 'px');
      root.classList.toggle('standalone', standalone());
    };
    set();
    addEventListener('resize', set);
    addEventListener('orientationchange', () => setTimeout(set, 300));
  }

  /* ── 2. 로딩 ── */
  function bootDone() { const b = $('.ak-boot'); if (!b) return; b.classList.add('out'); setTimeout(() => b.remove(), 300); }

  let tapAt = 0, tapEl = null, busyN = 0, pillTm = 0, busyLabel = '잠깐만요, 처리 중이에요', busyEmoji = '⏳';
  ['pointerdown', 'change'].forEach(t => document.addEventListener(t, e => {
    tapAt = Date.now();
    if (t === 'pointerdown') tapEl = e.target.closest?.('button,label,.btn,[role=button]') || null;
  }, true));
  function busyUI(on, label) {
    let bar = $('.ak-bar'), pill = $('.ak-pill');
    if (on) {
      if (!bar) { bar = document.createElement('div'); bar.className = 'ak-bar'; document.body.appendChild(bar); }
      if (!pill) { pill = document.createElement('div'); pill.className = 'ak-pill'; pill.setAttribute('role', 'status'); document.body.appendChild(pill); }
      pill.innerHTML = `<span class="e">${busyEmoji}</span><span></span><span class="d"><i></i><i></i><i></i></span>`;
      pill.children[1].textContent = label || busyLabel;
      pill.classList.toggle('top', !!$('.ak-sheet.on'));           // 시트가 열려 있으면 버튼을 가리지 않게 위로
      requestAnimationFrame(() => bar.classList.add('on'));
      clearTimeout(pillTm); pillTm = setTimeout(() => pill.classList.add('on'), 350);   // 금방 끝나면 알약은 안 띄움
    } else {
      clearTimeout(pillTm); bar?.classList.remove('on'); pill?.classList.remove('on');
      document.querySelectorAll('.is-busy').forEach(x => x.classList.remove('is-busy'));
    }
  }
  function track(p, { el, label } = {}) {
    busyN++; const b = $(el) || tapEl; if (b && document.contains(b)) b.classList.add('is-busy'); busyUI(true, label);
    const done = () => { if (--busyN <= 0) { busyN = 0; busyUI(false); } };
    p.then(done, done); return p;
  }
  /* 사용자가 누른 지 1.5초 안에 시작된 요청만 표시한다. 배경 새로고침은 조용히. */
  function wrap(fn, skip) {
    return function (...a) {
      const p = fn.apply(this, a);
      if (Date.now() - tapAt > 1500 || (skip && skip(...a))) return p;
      return track(p);
    };
  }
  /* 버튼째 돌리면 축이 어긋나 꿀렁거리고, 응답이 오는 순간 멈추면 0도로 툭 튄다(개찰알림에서 지적).
     → 안의 svg 만 돌리고, 끝나면 돌던 바퀴를 마저 돈 뒤(animationiteration) 멈춘다. 여러 요청이 겹쳐도 마지막이 끝날 때까지 돈다 */
  function spin(el, p) {
    el = $(el); if (!el) return p;
    const ic = el.querySelector('svg') || el;
    ic.dataset.spinN = (+ic.dataset.spinN || 0) + 1;
    ic.classList.add('ak-spin');
    const off = () => {
      if (--ic.dataset.spinN > 0) return;
      const stop = () => { if (+ic.dataset.spinN <= 0) ic.classList.remove('ak-spin'); };
      ic.addEventListener('animationiteration', stop, { once: true });
      setTimeout(stop, 2600);
    };
    p.then(off, off); return p;
  }
  /* 입력칸이 화면 아래쪽이면 키보드에 가려 누를 수 없었다(개찰알림 설정 탭) → 누르는 동안 아래 여백을 늘리고 그 칸을 가운데로 */
  function keyboardSafe(view = '#sc') {
    const sel = view + ' input,' + view + ' select,' + view + ' textarea';
    document.addEventListener('focusin', e => {
      if (!e.target.matches?.(sel)) return;
      document.body.classList.add('kb');
      setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 350);
    });
    document.addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement?.matches?.(sel)) document.body.classList.remove('kb'); }, 200));
  }
  function setBusy({ label, emoji } = {}) { if (label) busyLabel = label; if (emoji) busyEmoji = emoji; }

  let toastTm = 0;
  function toast(msg, ms = 2400) {
    let t = $('.ak-toast');
    if (!t) { t = document.createElement('div'); t.className = 'ak-toast'; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); document.body.appendChild(t); }
    t.textContent = msg; requestAnimationFrame(() => t.classList.add('on'));
    clearTimeout(toastTm); toastTm = setTimeout(() => t.classList.remove('on'), ms);
  }

  /* ── 3. 스와이프 ──
     · 세로 스크롤과 헷갈리지 않게: 가로 이동이 세로의 1.5배 이상, 60px 이상, 0.7초 이내일 때만.
     · 가로로 스크롤되는 영역·입력칸·지도·[data-noswipe] 안에서 시작하면 무시.
     · 화면 왼쪽 끝 24px 에서 시작하면 무시 (사파리 뒤로 가기 동작과 겹침). */
  function hScrollable(n, stop) {
    for (; n && n !== stop && n.nodeType === 1; n = n.parentElement) {
      if (n.matches('[data-noswipe],input,textarea,select,.ak-hscroll,.leaflet-container,canvas')) return true;
      if (n.scrollWidth > n.clientWidth + 4 && /(auto|scroll)/.test(getComputedStyle(n).overflowX)) return true;
    }
    return false;
  }
  function swipe(el, { onNext, onPrev, min = 60 } = {}) {
    el = $(el); let x0 = null, y0 = 0, t0 = 0;
    el.addEventListener('touchstart', e => {
      x0 = null; if (e.touches.length !== 1) return;
      const t = e.touches[0]; if (t.clientX < 24 || hScrollable(e.target, el)) return;
      x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
    }, { passive: true });
    el.addEventListener('touchend', e => {
      if (x0 == null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
      if (Math.abs(dx) < min || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - t0 > 700) return;
      (dx < 0 ? onNext : onPrev)?.();
    }, { passive: true });
    el.addEventListener('touchcancel', () => { x0 = null; }, { passive: true });
  }
  /* 탭바(.ak-tabs button[data-tab]) + 내용(render) + 스와이프를 한 번에 연결 */
  function tabs({ bar = '.ak-tabs', view = '#sc', ids, start, render, remember = 'ak-tab' }) {
    bar = $(bar); view = $(view);
    let cur = start || ids[0];
    try { const s = localStorage.getItem(remember); if (remember && ids.includes(s)) cur = s; } catch (e) {}
    function go(id, dir) {
      if (!ids.includes(id)) return;
      if (dir == null) dir = Math.sign(ids.indexOf(id) - ids.indexOf(cur));
      cur = id; try { remember && localStorage.setItem(remember, id); } catch (e) {}
      bar?.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
      render(id); view.scrollTop = 0;
      view.classList.remove('ak-in-l', 'ak-in-r');
      if (dir) { void view.offsetWidth; view.classList.add(dir > 0 ? 'ak-in-l' : 'ak-in-r'); }
    }
    bar?.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
    swipe(view, {
      onNext: () => { const i = ids.indexOf(cur); if (i < ids.length - 1) go(ids[i + 1], 1); },
      onPrev: () => { const i = ids.indexOf(cur); if (i > 0) go(ids[i - 1], -1); },
    });
    go(cur, 0);
    /* 배경 새로고침용 다시 그리기: go() 는 scrollTop 을 0 으로 만든다 → 1분마다 목록이 맨 위로 튕겼다. redraw() 는 보던 위치를 지킨다 */
    function redraw() { const top = view.scrollTop; render(cur); view.scrollTop = top; }
    return { go, redraw, get current() { return cur; } };
  }

  /* ── 4. 바텀시트 ── 손잡이(.ak-grab)를 끌어내리거나 바깥을 누르면 닫힌다 */
  function sheet(el) {
    el = $(el);
    let scrim = el.previousElementSibling?.classList.contains('ak-scrim') ? el.previousElementSibling : null;
    if (!scrim) { scrim = document.createElement('div'); scrim.className = 'ak-scrim'; el.before(scrim); }
    const open = () => { el.style.transform = ''; el.classList.add('on'); scrim.classList.add('on'); };
    const close = () => { el.style.transform = ''; el.classList.remove('on'); scrim.classList.remove('on'); };
    scrim.addEventListener('click', close);
    const g = el.querySelector('.ak-grab');
    if (g) {
      let y0 = null, moved = 0, t0 = 0;
      g.addEventListener('pointerdown', e => { y0 = e.clientY; t0 = Date.now(); moved = 0; el.classList.add('dragging'); g.setPointerCapture(e.pointerId); });
      g.addEventListener('pointermove', e => { if (y0 == null) return; moved = Math.max(0, e.clientY - y0); el.style.transform = `translateY(${moved}px)`; });
      const up = () => {
        if (y0 == null) return; y0 = null; el.classList.remove('dragging');
        const v = moved / Math.max(1, Date.now() - t0);
        if (moved > el.offsetHeight * .3 || v > .5) close(); else el.style.transform = '';
      };
      g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
    }
    return { open, close, get isOpen() { return el.classList.contains('on'); } };
  }

  /* ── 5. 새 버전 자동 열기 ──
     휴대폰이 예전 화면을 붙잡고 있을 때: version.txt 숫자가 이 페이지의 build 와 다르면 ?v=숫자 로 다시 연다.
     같은 버전으로 두 번 되돌지 않게 sessionStorage 에 기록한다. */
  function autoUpdate(build, url = 'version.txt') {
    const chk = () => fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(v => {
      v = (v || '').trim(); if (!/^[0-9]+$/.test(v) || v === String(build)) return;
      try { if (sessionStorage.getItem('ak-up') === v) return; sessionStorage.setItem('ak-up', v); } catch (e) {}
      location.replace(location.pathname + '?v=' + v + location.hash);
    }).catch(() => {});
    chk(); document.addEventListener('visibilitychange', () => { if (!document.hidden) chk(); });
  }

  /* ── 6. 진단 ── 화면 문제를 볼 때 설정 화면 맨 아래에 작게 보여 준다 */
  function env(build) {
    const p = document.createElement('div');
    p.style.cssText = 'position:fixed;top:env(safe-area-inset-top);height:env(safe-area-inset-bottom);visibility:hidden';
    document.body.appendChild(p); const cs = getComputedStyle(p), st = cs.top, sb = cs.height; p.remove();
    return `버전 ${build ?? '-'} · ${standalone() ? '홈 화면 앱' : '브라우저'} · 화면 ${screen.width}×${screen.height} · 웹뷰 ${innerWidth}×${innerHeight} · 안전영역 위 ${st} 아래 ${sb} · 보정 ${gap}px`;
  }

  /* ── 7. 저장·글자·숫자 ── */
  /* 저장소: 앱마다 접두어를 붙이고(같은 github.io 주소를 여러 앱이 함께 쓴다), 막혀 있어도 앱이 죽지 않게 try 로 감싼다 */
  function store(prefix) {
    const k = n => prefix + '.' + n;
    return {
      get(n, d) { try { const v = localStorage.getItem(k(n)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
      set(n, v) { try { localStorage.setItem(k(n), JSON.stringify(v)); } catch (e) {} },
      del(n) { try { localStorage.removeItem(k(n)); } catch (e) {} },
    };
  }
  /* 서버·사용자 글자를 innerHTML 에 넣을 때는 반드시 esc() */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const num = n => Math.round(n).toLocaleString('ko-KR');
  const krw = n => (n < 0 ? '−' : '') + num(Math.abs(n)) + '원';
  const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + num(Math.abs(n));
  /* 날짜는 휴대폰 시간대와 상관없이 한국 시간 기준 YYYY-MM-DD */
  const kstDate = (d = new Date()) => new Date(d.getTime() + 9 * 3600e3).toISOString().slice(0, 10);

  function poll(fn, ms, busy) {

  }

  function sequence() { let n = 0; return { next: () => ++n, is: v => v === n }; }

  function sure(btn, label = '정말 삭제') {

/* 서버가 알려 준 명함 영역(0~1 비율)만 잘라 낸다. 이상하면 원본 그대로 */
async function crop(src, box) {
  const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  let [l, t, r, b] = Array.isArray(box) && box.length === 4 ? box : [0, 0, 1, 1];
  if (!(r - l > .2 && b - t > .2)) [l, t, r, b] = [0, 0, 1, 1];
  const pad = .015; l = Math.max(0, l - pad); t = Math.max(0, t - pad); r = Math.min(1, r + pad); b = Math.min(1, b + pad);
  const sw = (r - l) * im.width, sh = (b - t) * im.height, s = Math.min(1, 1100 / Math.max(sw, sh));
  const c = document.createElement('canvas'); c.width = Math.round(sw * s); c.height = Math.round(sh * s);
  c.getContext('2d').drawImage(im, l * im.width, t * im.height, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .8);
}

/* ── 연락처 파일(vCard) ── 아이폰에서 열면 '연락처에 추가' 화면이 뜬다 */
const vq = s => String(s || '').replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
const vcard = c => ['BEGIN:VCARD', 'VERSION:3.0', `N:${vq(c.name.slice(0, 1))};${vq(c.name.slice(1))};;;`, `FN:${vq(c.name)}`,
  c.org && `ORG:${vq(c.org)}${c.dept ? ';' + vq(c.dept) : ''}`, c.title && `TITLE:${vq(c.title)}`,
  c.mobile && `TEL;TYPE=CELL:${c.mobile}`, c.tel && `TEL;TYPE=WORK:${c.tel}`, c.fax && `TEL;TYPE=FAX:${c.fax}`, c.email && `EMAIL;TYPE=WORK:${c.email}`,
  c.addr && `ADR;TYPE=WORK:;;${vq(c.addr)};;;;`, c.web && `URL:${c.web}`, c.memo && `NOTE:${vq(c.memo)}`, 'END:VCARD'].filter(Boolean).join('\r\n');
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function backup() {
  const photos = {}; for (const c of S.cards) if (c.photo) { const p = await PH.get(c.id); if (p) photos[c.id] = p; }
  download(`명함첩-백업-${AppKit.kstDate()}.json`, JSON.stringify({ app: 'card-book', v: 1, cards: S.cards, photos }), 'application/json');
  AppKit.toast(`${S.cards.length}장을 백업 파일로 받았어요`);
}
async function restore(file) {
  try {
    const j = JSON.parse(await file.text()); if (!Array.isArray(j.cards)) throw 0;
    const have = new Set(S.cards.map(c => c.id)); let n = 0;
    for (const c of j.cards) { if (have.has(c.id)) continue; n++; await store(c, j.photos?.[c.id]); }
    AppKit.toast(n ? `${n}장을 불러왔어요` : '새로 불러올 명함이 없어요'); tabs.redraw();
  } catch (e) { AppKit.toast('백업 파일을 읽지 못했어요'); }
}

/* ── 입력 ── */
document.addEventListener('change', async e => {
  if (e.target.name === 'org' && e.target.form?.id === 'fm') { const o = list().find(x => x.org === e.target.value); if (o) e.target.form.cat.value = o.cat; }
  if (e.target.id === 'shot' && e.target.files[0]) { draft = { photo: await AppKit.toJpeg(e.target.files[0], 1100, .8) }; const l = e.target.closest('.shot'); l.querySelector('svg,img')?.remove(); l.insertAdjacentHTML('afterbegin', `<img src="${draft.photo}" alt="">`); }
  if (e.target.id === 'restore' && e.target.files[0]) restore(e.target.files[0]);
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'srvf') {
    const url = e.target.url.value.trim(), token = e.target.token.value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) return AppKit.toast('주소는 https://script.google.com/… /exec 로 끝나야 해요');
    const old = S.srv; S.srv = { url, token };
    try { const d = await api('ping'); LS.set('srv', S.srv); S.ai = d.ai; LS.set('ai', d.ai); S.demo = false; LS.set('demo', false); S.sig = '';
      AppKit.toast(`연결했어요 · 서버 명함 ${d.count}장`); await refresh(); tabs.go('list'); }
    catch (err) { S.srv = old; AppKit.toast(plain(err)); }
    return;
  }
  if (e.target.id !== 'fm') return;
  if (S.demo) return AppKit.toast('예시에서는 저장되지 않아요. 설정에서 예시를 꺼 주세요');
  const btn = e.target.querySelector('[type=submit]'); if (btn.disabled) return; btn.disabled = true;
  const v = Object.fromEntries(new FormData(e.target)); for (const k in v) v[k] = String(v[k]).trim();
  if (!v.name) { AppKit.toast('이름을 넣어 주세요'); btn.disabled = false; return; }
  const old = S.cur && S.cards.find(x => x.id === S.cur);
  const card = old ? { ...old, ...v, checked: true } : { id: 'c' + Date.now().toString(36), at: Date.now(), met: AppKit.kstDate(), fav: false, checked: true, ...v };
  sheet.close(); await store(card, draft?.photo); draft = null;
  AppKit.toast(old ? '고쳤어요' : `${card.name} 님 명함을 넣었어요`); tabs.redraw();
});
/* 검색은 글자마다 목록만 다시 그린다(한글 조합 중인 글자가 깨지지 않게 입력칸은 그대로) */
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; drawList(); } });

/* ── 누르기 ── */
document.addEventListener('click', async e => {
  const q = s => e.target.closest(s);
  if (q('[data-shoot]')) { shooter.click(); return; }
  if (q('[data-open]')) return openCard(q('[data-open]').dataset.open);
  if (q('[data-retry]')) { const p = S.pending.find(x => x.id === q('[data-retry]').dataset.retry); S.pending = S.pending.filter(x => x !== p); tabs.redraw(); return openForm(null, { photo: p.img }); }
  if (q('[data-catpick]')) return openPick('cat');
  if (q('[data-cat]')) { S.cat = q('[data-cat]').dataset.cat; LS.set('cat', S.cat); sheet.close(); tabs.redraw(); return; }
  if (q('[data-sort]')) { const k = Object.keys(SORTS); S.sort = k[(k.indexOf(S.sort) + 1) % k.length]; LS.set('sort', S.sort); tabs.redraw(); AppKit.toast(SORTS[S.sort] + '으로 보여 드릴게요'); return; }
  if (q('#find')) { if (tabs.current !== 'list') tabs.go('list'); S.search = true; tabs.redraw(); document.getElementById('q')?.focus(); return; }
  if (q('[data-searchoff]')) { S.search = false; S.q = ''; tabs.redraw(); return; }
  if (q('[data-orgoff]')) { S.org = ''; drawList(); return; }
  if (q('[data-goorg]')) { S.org = q('[data-goorg]').dataset.goorg; S.cat = '전체'; S.q = ''; tabs.go('list'); return; }
  if (q('[data-goset]')) return tabs.go('set');
  if (q('[data-demo]')) { S.demo = q('[data-demo]').dataset.demo === 'on'; LS.set('demo', S.demo); S.cat = '전체'; updCount(); tabs.go(S.demo ? 'list' : tabs.current); return; }
  if (q('[data-srvoff]')) { if (!AppKit.sure(q('[data-srvoff]'), '연결을 끊을까요?')) return; S.srv = null; LS.del('srv'); AppKit.toast('연결을 끊었어요. 휴대폰 안 명함은 그대로 있어요'); tabs.redraw(); return; }
  if (q('[data-backup]')) return backup();
  if (q('[data-vcfall]')) { if (!list().length) return AppKit.toast('내보낼 명함이 없어요'); download('명함첩-연락처.vcf', list().map(vcard).join('\r\n'), 'text/vcard'); return; }
  const c = list().find(x => x.id === S.cur);
  if (!c) return;
  if (q('[data-vcf]')) { download(c.name + '.vcf', vcard(c), 'text/vcard'); return; }
  if (q('[data-edit]')) return openForm(c.id);
  if (q('[data-ok]')) { c.checked = true; if (!S.demo) await store(c); AppKit.toast('확인했어요'); openCard(c.id); tabs.redraw(); return; }
  if (q('[data-fav]')) { c.fav = !c.fav; if (!S.demo) await store(c); AppKit.toast(c.fav ? '즐겨찾기에 넣었어요' : '즐겨찾기에서 뺐어요'); openCard(c.id); tabs.redraw(); return; }
  if (q('[data-delete]')) {
    if (S.demo) return AppKit.toast('예시 명함은 지울 수 없어요');
    if (!AppKit.sure(q('[data-delete]'), '정말 지울까요?')) return;
    S.cards = S.cards.filter(x => x.id !== c.id); PH.del(c.id); keep(); sheet.close(); AppKit.toast('지웠어요'); tabs.redraw();
    if (S.srv) send({ action: 'del', data: { id: c.id } });
  }
});

function updCount() { const n = list().filter(c => !c.checked).length; document.getElementById('st').textContent = n ? `확인 필요 ${n}` : ''; }
/* 사진 버튼을 탭바 바로 위에 두기 위해 탭바 높이를 잰다 */
const setTabH = () => document.documentElement.style.setProperty('--tabh', document.querySelector('.ak-tabs').offsetHeight + 'px');
setTabH(); addEventListener('resize', setTabH);
updCount();
AppKit.bootDone();
if (S.srv) { api('ping').then(d => { S.ai = d.ai; LS.set('ai', d.ai); }).catch(() => {}); refresh(); }
AppKit.poll(refresh, 60000, () => sheet.isOpen || S.pending.length > 0);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
